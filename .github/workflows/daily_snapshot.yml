name: David V13 100-Stock Daily Snapshot

on:
  workflow_dispatch:
  schedule:
    # 06:45 UTC = 14:45 Taiwan time; Monday-Friday after TW market close
    - cron: "45 6 * * 1-5"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Save 100-stock daily snapshot to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python daily_snapshot_v13.py
